/*
 * HyperFetchMobile App 模块构建配置（纯 Java）
 * 单一事实来源：AGP 8.2.0 + Gradle 8.2 + JDK 17
 * 本项目为纯 Java Android 项目，不使用 Kotlin/KAPT/Hilt
 */

plugins {
    // Android 应用插件（本项目仅使用此一个插件）
    id 'com.android.application'
}

android {
    // 命名空间，用于 R 类和权限的包名前缀
    namespace 'com.hyperfetch'

    // 编译 SDK 版本（Android 14）
    compileSdk 34

    defaultConfig {
        // 应用 ID
        applicationId "com.hyperfetch"

        // 最低支持的 Android 版本（Android 8.0 Oreo，API 26）
        minSdk 26

        // 目标 SDK 版本
        targetSdk 34

        // 版本号与版本名
        versionCode 1
        versionName "1.0.0"

        // 测试运行器（AndroidX Test）
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 启用 multi-dex，避免大项目方法数超限
        multiDexEnabled true
    }

    buildTypes {
        release {
            // 发布版本：启用代码混淆与资源压缩
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 调试版本：不启用混淆，便于定位问题
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        // Java 源代码兼容性与目标字节码版本（Java 11，可与 JDK 17 兼容）
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        // 启用 ViewBinding，替代 findViewById
        viewBinding true
        // 保留 BuildConfig 类生成（默认已开启）
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError false
        warningsAsErrors false
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

// ==================== 依赖配置 ====================
dependencies {

    // -------------------- AndroidX 核心 --------------------
    // AndroidX Core（纯 Java，替代 ktx 版本，以匹配本项目纯 Java 定位）
    implementation "androidx.core:core:$core_version"
    // AppCompat 兼容库，提供向后兼容的 UI 组件
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    // Material Design 组件库
    implementation "com.google.android.material:material:$material_version"
    // ConstraintLayout 约束布局
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"
    // RecyclerView（主界面使用）
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // -------------------- 生命周期组件 --------------------
    // ViewModel（纯 Java 版本）
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    // LiveData（纯 Java 版本）
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    // Lifecycle runtime
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"

    // -------------------- Room 数据库 --------------------
    // Room 运行时库
    implementation "androidx.room:room-runtime:$room_version"
    // Room Guava 支持（为 LiveData/ListenableFuture 提供更好的 Java 兼容）
    implementation "androidx.room:room-guava:$room_version"
    // Room 注解处理器（纯 Java 使用 annotationProcessor）
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // -------------------- 网络请求 --------------------
    // OkHttp 网络库（用于 HTTP/HLS/FTP 下载）
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    // OkHttp 日志拦截器
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"

    // -------------------- WorkManager --------------------
    // WorkManager 核心库（纯 Java 版本）
    implementation "androidx.work:work-runtime:$work_version"

    // -------------------- 单元测试 --------------------
    // JUnit 测试框架
    testImplementation "junit:junit:$junit_version"
    // AndroidX Test 核心库
    testImplementation "androidx.test:core:$androidx_test_version"
    // Mockito 框架
    testImplementation "org.mockito:mockito-core:5.8.0"

    // -------------------- 仪器测试 --------------------
    androidTestImplementation "androidx.test:runner:$androidx_test_version"
    androidTestImplementation "androidx.test:rules:$androidx_test_version"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_version"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}
