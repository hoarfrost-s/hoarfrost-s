/*
 * HyperFetchMobile App 模块构建配置
 * 主要功能：多线程下载管理器
 */

plugins {
    // Android 应用插件
    id 'com.android.application'
    // Kotlin Android 插件（可选）
    id 'org.jetbrains.kotlin.android'
    // Hilt 依赖注入插件
    id 'com.google.dagger.hilt.android'
    // KAPT 注解处理器（用于 Hilt 和 Room）
    id 'kotlin-kapt'
}

android {
    // 命名空间，用于 R 类和权限的包名前缀
    namespace 'com.hyperfetch'

    // 编译 SDK 版本
    compileSdk 34

    // 默认配置
    defaultConfig {
        // 应用 ID，唯一标识应用
        applicationId "com.hyperfetch"

        // 最低支持的 Android 版本（Android 8.0 Oreo）
        minSdk 26

        // 目标 SDK 版本（Android 14）
        targetSdk 34

        // 版本号，用于版本控制
        versionCode 1

        // 版本名称，显示给用户
        versionName "1.0.0"

        // 测试运行器
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 启用多 dex 支持
        multiDexEnabled true
    }

    // 构建类型配置
    buildTypes {
        // 发布版本配置
        release {
            // 启用代码混淆和优化
            minifyEnabled true
            // 启用资源压缩
            shrinkResources true
            // 使用默认的 ProGuard 规则文件
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // 调试版本配置
        debug {
            // 调试版本不启用混淆
            minifyEnabled false
            // 调试版本添加调试后缀
            applicationIdSuffix ".debug"
            // 版本名称后缀
            versionNameSuffix "-debug"
        }
    }

    // 编译选项
    compileOptions {
        // Java 源代码兼容性版本（Java 11）
        sourceCompatibility JavaVersion.VERSION_11
        // Java 目标字节码版本（Java 11）
        targetCompatibility JavaVersion.VERSION_11
    }

    // Kotlin 编译选项
    kotlinOptions {
        // Kotlin JVM 目标版本
        jvmTarget = '11'
    }

    // 构建特性配置
    buildFeatures {
        // 启用 ViewBinding，用于视图绑定
        viewBinding true
        // 启用 DataBinding（可选）
        dataBinding true
        // 启用 BuildConfig 类生成
        buildConfig true
    }

    // 测试选项
    testOptions {
        // 单元测试配置
        unitTests {
            // 启用 Android 资源测试
            includeAndroidResources = true
            // 返回默认值，避免 Mock 所有 Android API
            returnDefaultValues = true
        }
    }

    // Lint 配置
    lint {
        // 中止于错误级别
        abortOnError false
        // 检查所有警告
        warningsAsErrors false
        // 忽略的 Lint 规则
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

// 依赖配置
dependencies {
    // ==================== AndroidX 核心库 ====================
    // AndroidX Core 核心库
    implementation "androidx.core:core-ktx:$core_ktx_version"

    // AppCompat 兼容库，提供向后兼容的 UI 组件
    implementation "androidx.appcompat:appcompat:$appcompat_version"

    // Material Design 组件库
    implementation "com.google.android.material:material:$material_version"

    // ConstraintLayout 约束布局
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"

    // ==================== 生命周期组件 ====================
    // ViewModel 组件
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    // LiveData 组件
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    // 生命周期运行时组件
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // ==================== Room 数据库 ====================
    // Room 运行时库
    implementation "androidx.room:room-runtime:$room_version"

    // Room Kotlin 扩展和协程支持
    implementation "androidx.room:room-ktx:$room_version"

    // Room 编译器（注解处理器）
    kapt "androidx.room:room-compiler:$room_version"

    // ==================== 网络请求 ====================
    // Retrofit 核心库
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"

    // Retrofit Gson 转换器
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"

    // OkHttp 网络库
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"

    // OkHttp 日志拦截器
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"

    // ==================== 协程 ====================
    // Kotlin 协程核心库
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"

    // Kotlin 协程 Android 扩展
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // ==================== WorkManager ====================
    // WorkManager 核心库
    implementation "androidx.work:work-runtime-ktx:$work_version"

    // ==================== 依赖注入 ====================
    // Hilt 核心库
    implementation "com.google.dagger:hilt-android:$hilt_version"

    // Hilt 编译器
    kapt "com.google.dagger:hilt-compiler:$hilt_version"

    // Hilt 与 WorkManager 集成
    implementation "androidx.hilt:hilt-work:1.1.0"

    // Hilt 编译器（WorkManager 集成）
    kapt "androidx.hilt:hilt-compiler:1.1.0"

    // ==================== 单元测试 ====================
    // JUnit 测试框架
    testImplementation "junit:junit:$junit_version"

    // AndroidX 测试核心库
    testImplementation "androidx.test:core:$androidx_test_version"

    // Mockito 框架
    testImplementation "org.mockito:mockito-core:5.8.0"

    // Kotlin 协程测试
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"

    // ==================== 仪器测试 ====================
    // AndroidX 测试运行器
    androidTestImplementation "androidx.test:runner:$androidx_test_version"

    // AndroidX 测试规则
    androidTestImplementation "androidx.test:rules:$androidx_test_version"

    // Espresso UI 测试框架
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_version"

    // AndroidX JUnit 扩展
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}

// Kapt 配置
kapt {
    // 启用 Kapt 正确性检查
    correctErrorTypes true
}