// Top-level build file where you can add configuration options common to all sub-projects/modules.
// 单一事实来源：AGP 8.2.0 + Gradle 8.2 + JDK 17

buildscript {
    ext {
        // Android Gradle Plugin 版本
        agp_version = '8.2.0'
        // AndroidX 核心库版本（纯 Java）
        core_version = '1.12.0'
        appcompat_version = '1.6.1'
        material_version = '1.11.0'
        constraintlayout_version = '2.1.4'
        lifecycle_version = '2.7.0'
        // Room 数据库版本
        room_version = '2.6.1'
        // OkHttp 版本
        okhttp_version = '4.12.0'
        // WorkManager 版本
        work_version = '2.9.0'
        // JUnit 测试版本
        junit_version = '4.13.2'
        // AndroidX Test 版本
        androidx_test_version = '1.1.5'
        // Espresso UI 测试版本
        espresso_version = '3.5.1'
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        // Android Gradle 插件
        classpath "com.android.tools.build:gradle:$agp_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
